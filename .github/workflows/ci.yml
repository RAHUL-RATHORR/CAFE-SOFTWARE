name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  AUTH_SECRET: ci-test-secret-at-least-32-chars-long
  NEXT_PUBLIC_APP_NAME: DineFlow
  APP_ENV: development

jobs:
  quality:
    name: Install · Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --coverage

      - name: Integration tests
        run: npm run test:integration

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          AUTH_SECRET: ${{ env.AUTH_SECRET }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
          APP_ENV: development

      - name: Upload build artifact placeholder
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone-placeholder
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          AUTH_SECRET: ${{ env.AUTH_SECRET }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          APP_ENV: development

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true
          PLAYWRIGHT_PORT: "3100"
          AUTH_SECRET: ${{ env.AUTH_SECRET }}
          NEXT_PUBLIC_APP_NAME: ${{ env.NEXT_PUBLIC_APP_NAME }}
          APP_ENV: development

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            dineflow-app:ci
            dineflow-app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_NAME=DineFlow
            NEXT_PUBLIC_APP_VERSION=0.1.0
            NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/dineflow-image.tar

      - name: Upload Docker image artifact placeholder
        uses: actions/upload-artifact@v4
        with:
          name: dineflow-docker-image
          path: /tmp/dineflow-image.tar
          retention-days: 3
          if-no-files-found: warn

  deploy-placeholder:
    name: Deployment Placeholder
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deployment placeholder
        run: |
          echo "Deployment placeholder — wire VPS / Railway / Render / cloud VM here."
          echo "Image tag candidate: ${{ github.sha }}"
          echo "No cloud deploy is executed by this workflow."
